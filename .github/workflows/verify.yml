name: Numerical tests and HTML documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-document:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q code tests
      - name: Run automated tests and save report
        run: |
          mkdir -p verification docs/api
          python -m pytest tests -v --junitxml=verification/pytest-results.xml | tee verification/test_report.txt
          test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Generate HTML API documentation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          scripts = [
            '30_compare_matching_methods.py',
            '28_segmentation_sensitivity.py',
            '29_visual_segmentation_validation.py',
            '27_batch_tree_pipeline.py',
          ]
          folder = Path('docs/api')
          for filename in scripts:
              # Isolated module documentation to avoid importing other experimental scripts.
              target = Path('code') / filename
              subprocess.run(['python', '-m', 'pdoc', '-o', str(folder), str(target)], check=True)
          PY
      - name: Upload verification report and generated docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-tests-and-html-docs
          path: |
            verification/
            docs/api/
          if-no-files-found: warn
